# /etc/nginx/sites-available/default-catchall
# Rejects any request whose Host header doesn't match one of our real
# server_names (indishzambia.com / www / dashboard.indishzambia.com) —
# without this, nginx falls back to treating the first-defined vhost as an
# implicit default, so an old/foreign domain still pointed at this droplet's
# IP (e.g. leftover DNS from a domain that's since been handed back to a
# client) would silently get served our site instead of being turned away.
#
# Install:
#   sudo cp deploy/nginx-default-catchall.conf /etc/nginx/sites-available/default-catchall
#   sudo ln -s /etc/nginx/sites-available/default-catchall /etc/nginx/sites-enabled/default-catchall
#   sudo nginx -t && sudo systemctl reload nginx
#
# The ssl_certificate below just needs to be *some* valid cert already on
# the box to terminate TLS with — it's never actually served meaningfully
# since every request here gets dropped (444) regardless of host.

server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name _;
    return 444;
}

server {
    listen 443 ssl default_server;
    listen [::]:443 ssl default_server;
    server_name _;
    ssl_certificate /etc/letsencrypt/live/indishzambia.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/indishzambia.com/privkey.pem;
    return 444;
}
