# /etc/nginx/sites-available/indish
# Serves the built React app as static files and reverse-proxies /api to Express (PM2, port 4000).
#
# Install:
#   sudo cp deploy/nginx.conf /etc/nginx/sites-available/indish
#   sudo ln -s /etc/nginx/sites-available/indish /etc/nginx/sites-enabled/indish
#   sudo rm -f /etc/nginx/sites-enabled/default
#   sudo nginx -t && sudo systemctl reload nginx
#
# Then run certbot (see deploy/DEPLOY.md) to fill in the ssl_certificate lines
# and add the HTTPS server block it generates.

server {
    listen 80;
    listen [::]:80;
    server_name indishkitwe.com www.indishkitwe.com;

    # Static frontend build
    root /var/www/indish/frontend/dist;
    index index.html;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;

    client_max_body_size 2m;

    # API -> Express (PM2, port 4000)
    location /api/ {
        proxy_pass http://127.0.0.1:4000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;
    }

    # Cache hashed static assets aggressively
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # React Router — always fall back to index.html for client-side routes
    location / {
        try_files $uri $uri/ /index.html;
    }

    location = /favicon.svg {
        access_log off;
    }
}
