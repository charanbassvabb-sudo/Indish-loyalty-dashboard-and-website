# /etc/nginx/sites-available/indish
# Serves the built React app as static files and reverse-proxies /api to Express (PM2, port 4000).
#
# Install:
#   sudo cp deploy/nginx.conf /etc/nginx/sites-available/indish
#   sudo ln -s /etc/nginx/sites-available/indish /etc/nginx/sites-enabled/indish
#   sudo rm -f /etc/nginx/sites-enabled/default
#   sudo nginx -t && sudo systemctl reload nginx
#
# Then run certbot (see deploy/DEPLOY.md) to fill in the ssl_certificate lines
# and add the HTTPS server block it generates.

server {
    listen 80;
    listen [::]:80;
    server_name indishzambia.com www.indishzambia.com;

    # Static frontend build
    root /var/www/indish/frontend/dist;
    index index.html;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;

    # 10m covers the 8MB payment-screenshot limit and the 5MB menu-photo
    # limit (see backend/src/middleware/upload.ts and menuImageUpload.ts) —
    # this must stay >= the larger of the two or nginx rejects the upload
    # with a 413 before Express/multer even see it.
    client_max_body_size 10m;

    # API -> Express (PM2, port 4000)
    location /api/ {
        proxy_pass http://127.0.0.1:4000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;
    }

    # Cache hashed static assets aggressively
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # index.html is the one file that changes on every deploy without its
    # name changing (unlike /assets/*, which is content-hashed) — without an
    # explicit Cache-Control, browsers fall back to heuristic caching off
    # Last-Modified and can keep serving an old index.html (with old script
    # tags) for hours after a deploy. This forces a revalidation on every
    # load — cheap (a 304 when nothing changed). React Router's fallback
    # below serves index.html for every client-side route too, so this
    # covers those as well.
    location = /index.html {
        add_header Cache-Control "no-cache";
    }

    # Same reasoning as index.html — the service worker's own update check
    # is what evicts a visitor's stale asset cache, so a cached sw.js is the
    # one file that must never itself be stale.
    location = /sw.js {
        add_header Cache-Control "no-cache";
    }

    # React Router — always fall back to index.html for client-side routes
    location / {
        try_files $uri $uri/ /index.html;
    }

    location = /favicon.svg {
        access_log off;
    }
}
