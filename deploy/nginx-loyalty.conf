# /etc/nginx/sites-available/indish-loyalty
# Reverse-proxies dashboard.indishzambia.com to the loyalty app's PM2 process
# (TanStack Start SSR server, node-server preset, port 8081 — see
# ecosystem.config.cjs in indish-loyalty/ and this repo's DEPLOY.md).
#
# Install:
#   sudo cp deploy/nginx-loyalty.conf /etc/nginx/sites-available/indish-loyalty
#   sudo ln -s /etc/nginx/sites-available/indish-loyalty /etc/nginx/sites-enabled/indish-loyalty
#   sudo nginx -t && sudo systemctl reload nginx
#
# Then run certbot (see DEPLOY.md) to fill in the ssl_certificate lines and
# add the HTTPS server block it generates.

server {
    listen 80;
    listen [::]:80;
    server_name dashboard.indishzambia.com;

    client_max_body_size 2m;

    location / {
        proxy_pass http://127.0.0.1:8081;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;
    }
}
